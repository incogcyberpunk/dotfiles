# -------------------------------------------------------------------
# TERMINAL & COLORS
# -------------------------------------------------------------------
# Enable true color support in tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable extended keys support in tmux
set -s extended-keys always


# -------------------------------------------------------------------
# PREFIX
# -------------------------------------------------------------------
# use C-f for the prefix.
set-option -g prefix C-f


# -------------------------------------------------------------------
# GENERAL SETTINGS
# -------------------------------------------------------------------
# Initial setup
set -g status-keys vi
set -g mode-keys vi

# Mouse Mode
set -g mouse on

# Lengthen the amount of time status messages are displayed
set-option -g display-time 3000
set-option -g display-panes-time 3000

# Allow the arrow key to be used immediately after changing windows.
set-option -g repeat-time 0

# No delay for escape key press
set -sg escape-time 0

# Forward terminal focus (FocusGained/FocusLost) into tmux panes.
# Terminal editors (nvim, vim, emacs, helix) use it to auto-reload files
# changed on disk (e.g. nvim autoread) or auto-save on focus loss; without it
# inner programs assume they are always focused. Harmless no-op for other CLIs.
set -g focus-events on


# -------------------------------------------------------------------
# WINDOWS & PANES
# -------------------------------------------------------------------
# Set the base-index to 1 rather than 0
set -g base-index 1
set -w -g pane-base-index 1 # set window specific options with -w flag

# Automatically set window title
set -w -g automatic-rename on # set window specific options with -w flag

# Automatically set session title
set -g set-titles on


# -------------------------------------------------------------------
# KEYBINDINGS
# -------------------------------------------------------------------
# NAVIGATE THE SPLIT PANES
# NOTE:  `-T prefix` is optional , as without -T , by default prefix table is selected 
bind -T prefix h select-pane -L 
bind  l select-pane -R
bind  k select-pane -U
bind  j select-pane -D

# Resizing keybinds
bind -T root  C-Left resize-pane -L 5
bind -T root  C-Right resize-pane -R 5
bind -T root  C-Down resize-pane -D 5
bind -T root  C-Up resize-pane -U 5

# Open the new window in the current path that the current window is in
bind c new-window -c "#{pane_current_path}" 

# Create a new session with the prefix key and n 
bind n new-session

# Open split windows in the path that the current existing pane is in
bind-key v split-window -h -c '#{pane_current_path}' # vertical split in the current path as existing pane
bind-key g split-window -v -c '#{pane_current_path}' # horizontal split in the current path as existing pane

# NOTE:  `-n` is alias to `-T root`
unbind p
bind -n M-p previous-window
bind -n M-n next-window

# Synchronize panes
bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."

# Easy config reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."


# -------------------------------------------------------------------
# COPY MODE BINDS (-X flag with send-keys sends command to copy mode)
# -------------------------------------------------------------------
# KEY BINDINGS FOR COPY & PASTE METHODS
bind '[' display-message "Copy Mode Activated !!" \; copy-mode \; 

bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi x send-keys -X clear-selection
bind -T copy-mode-vi y send-keys -X copy-selection


# -------------------------------------------------------------------
# BELL
# -------------------------------------------------------------------
# Disable bell
setw -g monitor-bell off


# -------------------------------------------------------------------
# MISCELLANEOUS
# -------------------------------------------------------------------
# Allow programs to pass escape sequences straight through to the outer terminal (needed for yazi image preview / 24-bit color)
set -g allow-passthrough on

# Refresh TERM/TERM_PROGRAM on re-attach so yazi can detect the outer terminal for image previews
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM


# -------------------------------------------------------------------
# PLUGINS
# -------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'ssh kiro-cli git'

# tmux-continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '30'
set -g @continuum-restore 'on'

# extrakto
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'e' # open the extrakto fzf popup with prefix + e
set -g @extrakto_insert_key 'ctrl-i' # insert the selected text into the current pane (ctrl-i)
set -g @extrakto_clip_tool 'wl-copy' # force wl-copy on Wayland (auto misdetects xclip in tmux's env)

# -------------------------------------------------------------------
# THEME (palette in catppuccin-colors.conf)
# -------------------------------------------------------------------
source-file ~/.config/tmux/catppuccin-colors.conf


# -------------------------------------------------------------------
# STATUS BAR
# -------------------------------------------------------------------
set -gF status-style "bg=#{@thm_mantle},fg=#{@thm_fg}"
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 160

# Left: session pill. Caps are Nerd Font glyphs U+E0B6 / U+E0B4, not spaces.
# The icon block turns red while the prefix key is held.
set -g status-left "#[fg=#{?client_prefix,#{@thm_red},#{@thm_mauve}},bg=default]#[fg=#{@thm_crust},bg=#{?client_prefix,#{@thm_red},#{@thm_mauve}}] #[fg=#{@thm_fg},bg=#{@thm_surface_0}] #S#[fg=#{@thm_surface_0},bg=default] "

# Inactive window: cap, #I index segment, #W name segment, cap.
set -g window-status-format "#[fg=#{@thm_overlay_0},bg=default]#[fg=#{@thm_crust},bg=#{@thm_overlay_0}] #I #[fg=#{@thm_subtext_0},bg=#{@thm_surface_2}] #W #[fg=#{@thm_surface_2},bg=default]"
# Active window: same shape, maroon index and blue name, bold.
set -g window-status-current-format "#[fg=#{@thm_maroon},bg=default]#[fg=#{@thm_crust},bg=#{@thm_maroon},bold] #I #[fg=#{@thm_crust},bg=#{@thm_blue},bold] #W #[fg=#{@thm_blue},bg=default]"

# Right: git branch and dirty marker, only inside a repo; args are path then colours.
set -g status-right "#(~/.config/tmux/scripts/tmux-git-status.sh #{q:pane_current_path} '#{@thm_green}' '#{@thm_crust}' '#{@thm_fg}' '#{@thm_surface_0}' 'default')"
# Re-arm Continuum autosave, wiped by the line above; #{l:} makes a literal "#(".
set -agF status-right "#{l:#(}#{HOME}/.config/tmux/plugins/tmux-continuum/scripts/continuum_save.sh#{l:)}"


# -------------------------------------------------------------------
# UI COLOURS
# -------------------------------------------------------------------
set -gF message-style "fg=#{@thm_crust},bg=#{@thm_teal},fill=#{@thm_teal}"
set -gF message-command-style "fg=#{@thm_crust},bg=#{@thm_yellow},fill=#{@thm_yellow}"

# Styles for popup windows (eg: extrakto, floating panes)
set -gF popup-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -gF popup-border-style "fg=#{@thm_surface_1}"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
