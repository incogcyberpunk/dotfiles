# Enable true color support in tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Initial setup
set -g status-keys vi
set -g mode-keys vi

# use C-f for the prefix.
set-option -g prefix C-f

# NAVIGATE THE SPLIT PANES
# NOTE:  `-T prefix` is optional , as without -T , by default prefix table is selected 
bind -T prefix h select-pane -L 
bind  l select-pane -R
bind  k select-pane -U
bind  j select-pane -D

# Resizing keybinds
bind -T root  C-Left resize-pane -L 5
bind -T root  C-Right resize-pane -R 5
bind -T root  C-Down resize-pane -D 5
bind -T root  C-Up resize-pane -U 5

# Enable extended keys support in tmux
set -s extended-keys always

# Open the new window in the current path that the current window is in
bind c new-window -c "#{pane_current_path}" 

# Create a new session with the prefix key and n 
bind n new-session

# Open split windows in the path that the current existing pane is in
bind-key v split-window -h -c '#{pane_current_path}' # vertical split in the current path as existing pane
bind-key g split-window -v -c '#{pane_current_path}' # horizontal split in the current path as existing pane

# NOTE:  `-n` is alias to `-T root`
unbind p
bind -n M-p previous-window
bind -n M-n next-window


# Easily reorder windows with CTRL+SHIFT+Arrow
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# Synchronize panes
bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."


# Easy config reload
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

# KEY BINDINGS FOR COPY & PASTE METHODS
bind '[' display-message "Copy Mode Activated !!" \; copy-mode \; 

# -X flag with send-keys sends command to copy mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi 'v' send-keys -X begin-selection
bind -T copy-mode-vi 'y' send-keys -X copy-selection-and-cancel

# Mouse Mode
set -g mouse on

# Lengthen the amount of time status messages are displayed
set-option -g display-time 3000
set-option -g display-panes-time 3000


# Set the base-index to 1 rather than 0
set -g base-index 1
set -w -g pane-base-index 1 # set window specific options with -w flag


# Automatically set window title
set -w -g automatic-rename on # set window specific options with -w flag

# Automatically set session title
set -g set-titles on


# Allow the arrow key to be used immediately after changing windows.
set-option -g repeat-time 0

# No delay for escape key press
set -sg escape-time 0


# Change background color of a tab when activity occurs
setw -g monitor-activity on


# Disable bell
setw -g monitor-bell off


# Disable visual text box when activity occurs
set -g visual-activity off


# -------------------------------------------------------------------
# STATUS BAR
# -------------------------------------------------------------------
set -g status-justify centre
set -g status-bg black
set -g status-fg colour35
set -g status-interval 60
set -g status-left-length 50
set -g status-left "#[bg=colour35]💻#[fg=colour234,bold] #H#[bg=colour35,nobold]#[fg=colour234] [#S]"
set -g status-right '#[bg=colour35] 🕔 #[fg=colour234,bold]%H:%M '


# -------------------------------------------------------------------
# MISCELLANEOUS
# -------------------------------------------------------------------
# To allow passthrough of 24-bit colors through tmux to the terminal emulator so that it can deal with it (needed for yazi image preview too)
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# -----------------------------------------
# PLUGINS
# -----------------------------------------
set -g @plugin 'tmux-plugins/tpm'

# tmux-resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'bat ssh kiro-cli git'

# tmux-continuum
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '30'
set -g @continuum-restore 'on'

# tmux-open
set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.duckduckgo.com/?q='
set -g @open-G 'https://www.google.com/search?q='

# tmux-line-numbers (vim-style relative numbers in copy mode)
set -g @plugin 'JosephLai241/tmux-line-numbers'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
