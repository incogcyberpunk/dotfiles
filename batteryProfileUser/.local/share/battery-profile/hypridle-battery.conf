# Battery profile: dim early, lock, switch the panel off, then suspend.
# Battery brightness is already 10% (same as toggleAnimations.sh), so the dim
# step keeps a floor instead of going black. ponytail: 384 is 2% of this
# panel's raw max (19200); brightnessctl --min-value ignores "%". Update it if
# the panel changes.
listener {
    timeout = 120
    on-timeout = brightnessctl -s --min-value=384 set 2500- && notify-send -u low -h string:x-canonical-private-synchronous:battery-idle "Battery mode" "Screen dimmed; it will turn off soon."
    on-resume = brightnessctl -r
}

listener {
    timeout = 180
    on-timeout = pgrep -x hyprlock || hyprlock --grace 5
}

listener {
    timeout = 240
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 600
    on-timeout = playerctl -a pause; systemctl suspend
}

listener {
    timeout = 1500
    on-timeout = poweroff
}
