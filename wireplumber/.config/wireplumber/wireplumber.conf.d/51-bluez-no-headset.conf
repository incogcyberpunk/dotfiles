## Disable Bluetooth "headset mode" (HSP/HFP).
## Bluetooth headphones (e.g. Bass 430) will only expose A2DP, i.e. output only:
## no headset profile, no Bluetooth microphone, no auto-switch to low-quality audio.
##
## Note: bluez5.roles is a monitor-wide setting, so this applies to every
## Bluetooth audio device. Default roles minus hfp_hf / hfp_ag.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source bap_bcast_sink bap_bcast_source ]
}
