rules:
  - capability: fs_read
    effect: allow
    exclude: ["**/.env", "**/.env.*", "**/*.pem"]

  - capability: web_fetch
    effect: allow

  - capability: web_search
    effect: allow

  - capability: subagent
    effect: allow

  - capability: shell
    match:
      - "rm -rf *"
      - "ssh *"
      - "adb shell*"
      - "adb su*"
      - "adb install*"
      - "adb uninstall*"
      - "adb push *"
      - "adb pull *"
      - "adb reboot*"
      - "adb root"

    effect: ask

  - capability: shell
    match:
      - "ls *"
      - "echo *"
      - "printf *"
      - "cd *"
      - "cat *"
      - "which *"
      - "pwd"
      - "bat *"
      - "head *"
      - "tail *"
      - "wc *"
      - "file *"
      - "stat *"
      - "du *"
      - "df *"
      - "tree *"
      - "readlink *"
      - "realpath *"
      - "grep *"
      - "rg *"
      - "fd *"
      - "lsblk *"
      - "ip *"
      - "groups*"
      - "whoami"
      - "uname *"
      - "ps *"
      - "pgrep *"
      - "man *"
      - "type *"
      - "whence *"
      - "hyprctl *"
      - "wpctl status"
      - "nmcli *"
      - "systemctl status *"
      - "journalctl *"
      - "pacman -Q*"
      - "yay -Q*"
      - "zsh -n *"
      - "* --version"
      - "git status*"
      - "git diff*"
      - "git log*"
      - "git show*"
      - "git branch --show-current"
      - "git remote -v"
      - "gh pr view *"
      - "gh pr list*"
      - "gh issue view *"
      - "gh repo view*"
      # adb: read-only device info
      - "adb devices*"
      - "adb version"
      - "adb get-state"
      - "adb get-serialno"
      - "adb shell getprop*"
      - "adb shell pm list *"
      - "adb shell dumpsys *"
      - "adb logcat -d*"

    effect: allow
